doctrine:
    dbal:
        host: "%env(string:DATABASE_HOST)%"
        port: "%env(string:DATABASE_PORT)%"
        dbname: "%env(string:DATABASE_DATABASE_NAME)%"
        charset: "%env(string:DATABASE_CHARSET)%"
        user: "%env(string:DATABASE_USERNAME)%"
        server_version: "%env(string:DATABASE_SERVER_VERSION)%"
        password: "%env(string:DATABASE_PASSWORD)%"
        use_savepoints: true
        #url: '%env(DATABASE_URL)%'
        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '15'
        types:
            uuid: '\App\Domain\Doctrine\UuidStringType'
        default_table_options:
            charset: utf8mb4
            collate: utf8mb4_unicode_ci

    orm:
        report_fields_where_declared: true
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            App:
                is_bundle: false
                dir: '%kernel.project_dir%/src'
                prefix: 'App'
                alias: App

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
